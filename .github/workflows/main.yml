name: Build Hossam OneState Filters APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find ZIP
        run: |
          ZIP_FILE=$(find . -type f -name "*.zip" -not -path "./.git/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(find extracted -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f -name "settings.gradle" -print -quit)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Android project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix JVM 17
        run: |
          cd "$PROJECT_DIR"

          echo "Fixing Java and Kotlin JVM targets..."

          if [ -f "app/build.gradle.kts" ]; then

            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts

            printf '%s\n' \
              '' \
              '// HOSSAM JVM 17 FIX' \
              'android {' \
              '    compileOptions {' \
              '        sourceCompatibility = JavaVersion.VERSION_17' \
              '        targetCompatibility = JavaVersion.VERSION_17' \
              '    }' \
              '}' \
              '' \
              'tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {' \
              '    kotlinOptions {' \
              '        jvmTarget = "17"' \
              '    }' \
              '}' \
              >> app/build.gradle.kts

          elif [ -f "app/build.gradle" ]; then

            sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle
            sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle

            printf '%s\n' \
              '' \
              '// HOSSAM JVM 17 FIX' \
              'android {' \
              '    compileOptions {' \
              '        sourceCompatibility JavaVersion.VERSION_17' \
              '        targetCompatibility JavaVersion.VERSION_17
