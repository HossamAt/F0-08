name: Build Hossam OneState Filters APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================
      # 2. Java 17
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================
      # 3. Setup Gradle
      # =========================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # =========================
      # 4. Find ZIP
      # =========================
      - name: Find Project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # =========================
      # 5. Extract ZIP
      # =========================
      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted."


      # =========================
      # 6. Find Android project
      # =========================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================
      # 7. Force Java 17 + Kotlin 17
      # =========================
      - name: Force JVM 17
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "FORCING JAVA 17 / KOTLIN 17"
          echo "================================"

          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          APP_GRADLE_GROOVY="$PROJECT_DIR/app/build.gradle"

          if [ -f "$APP_GRADLE" ]; then

            echo "Found Kotlin Gradle file:"
            echo "$APP_GRADLE"

            cat >> "$APP_GRADLE" <<'EOF'

          // ===== HOSSAM JVM FIX =====

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          // ===== END HOSSAM JVM FIX =====

          EOF

          elif [ -f "$APP_GRADLE_GROOVY" ]; then

            echo "Found Groovy Gradle file:"
            echo "$APP_GRADLE_GROOVY"

            cat >> "$APP_GRADLE_GROOVY" <<'EOF'

          // ===== HOSSAM JVM FIX =====

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                 
