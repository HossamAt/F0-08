name: Build Hossam OneState Filters APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. تجهيز Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. البحث عن ZIP وفك الضغط
      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -e

          echo "ZIP files found:"
          find . -maxdepth 2 -type f \( -iname "*.zip" \) -print

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      # 4. تحديد مكان مشروع Android
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            echo "The ZIP must contain an Android Studio project."
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 5. تثبيت Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. إنشاء Gradle Wrapper إذا لم يكن موجودًا
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found."
            echo "Generating Gradle wrapper..."

            gradle wrapper --gradle-version 8.9
          fi

          chmod +x ./gradlew

      # 7. تنظيف المشروع
      - name: Clean project
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean

      # 8. بناء APK
      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      # 9. العثور على APK
      - name: Find APK
        shell: bash
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      # 10. رفع APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hossam-OneState-Filters-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
