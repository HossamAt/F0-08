name: Build Hossam OneState Filters APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # 1. تحميل المستودع
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================
      # 2. Java 17
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================
      # 3. البحث عن ZIP وفك الضغط
      # =========================
      - name: Extract Android ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for ZIP..."

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."


      # =========================
      # 4. إيجاد مشروع Android
      # =========================
      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find extracted \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found inside ZIP."
            exit 1
          fi

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # =========================
      # 5. إصلاح Java / Kotlin JVM
      # =========================
      - name: Fix JVM Compatibility
        shell: bash
        run: |
          set -e

          echo "Fixing Java/Kotlin JVM target..."

          find "$PROJECT_DIR" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

          # Java 8 -> Java 17
          find "$PROJECT_DIR" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -exec sed -i \
            's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' {} \;

          # Kotlin JVM 1.8 -> 17
          find "$PROJECT_DIR" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -exec sed -i \
            's/jvmTarget[[:space:]]*=[[:space:]]*"1\.8"/jvmTarget = "17"/g' {} \;

          find "$PROJECT_DIR" \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -exec sed -i \
            "s/jvmTarget[[:space:]]*=[[:space:]]*'1\.8'/jvmTarget = '17'/g" {} \;

          echo "JVM compatibility fixed."


      # =========================
      # 6. فحص إعدادات Gradle
      # =========================
      - name: Show Gradle Files
        shell: bash
        run: |
          echo "===== settings ====="

          if [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            cat "$PROJECT_DIR/settings.gradle.kts"
          elif [ -f "$PROJECT_DIR/settings.gradle" ]; then
            cat "$PROJECT_DIR/settings.gradle"
          fi

          echo "===== app build ====="

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            cat "$PROJECT_DIR/app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            cat "$PROJECT_DIR/app/build.gradle"
          fi


      # =========================
      # 7. Gradle
      # =========================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # =========================
      # 8. إنشاء Gradle Wrapper
      # =========================
      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "Gradle wrapper not found."
            echo "Generating wrapper..."

            gradle wrapper --gradle-version 8.9
          fi

          chmod +x ./gradlew


      # =========================
      # 9. تنظيف
      # =========================
      - name: Clean
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean


      # =========================
      # 10. بناء APK
      # =========================
      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon


      # =========================
      # 11. البحث عن APK
      # =========================
      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print


      # =========================
      # 12. رفع APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hossam-OneState-Filters-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
